<!DOCTYPE html>
<html lang="en">
<head>
 <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
 <meta http-equiv="Pragma" content="no-cache">
 <meta http-equiv="Expires" content="0">
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Table Standees — The Grand Estate Bistro</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
 <style>
 body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; padding: 24px; color: #f9fafb; margin: 0; }
 .control-header {
 max-width: 1000px;
 margin: 0 auto 28px;
 background: #111827;
 border: 1px solid #1f2937;
 padding: 18px 24px;
 border-radius: 10px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }
 .print-button {
 background: #0f172a;
 color: #fff;
 border: 1px solid #374151;
 padding: 10px 20px;
 border-radius: 6px;
 font-weight: 800;
 letter-spacing: 0.05em;
 font-size: 0.85rem;
 cursor: pointer;
 }
 .standee-grid {
 display: grid;
 grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
 gap: 28px;
 max-width: 1000px;
 margin: 0 auto;
 }
 .standee-card {
 background: #ffffff;
 color: #0f172a;
 border: 2px solid #0f172a;
 border-radius: 12px;
 padding: 36px 28px;
 text-align: center;
 page-break-inside: avoid;
 display: flex;
 flex-direction: column;
 align-items: center;
 }
 .hotel-name { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2px; }
 .hotel-sub { font-size: 0.75rem; color: #64748b; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 24px; }
 
 .qr-frame {
 width: 200px;
 height: 200px;
 background: #ffffff;
 border: 1px solid #e2e8f0;
 border-radius: 8px;
 padding: 10px;
 display: flex;
 align-items: center;
 justify-content: center;
 margin-bottom: 24px;
 }
 .qr-img { width: 100%; height: 100%; object-fit: contain; }

 .table-banner {
 background: #0f172a;
 color: #ffffff;
 font-size: 1.25rem;
 font-weight: 800;
 letter-spacing: 0.08em;
 padding: 8px 24px;
 border-radius: 6px;
 margin-bottom: 12px;
 display: inline-block;
 }
 .scan-instruction {
 font-size: 0.8rem;
 font-weight: 800;
 color: #0f172a;
 letter-spacing: 0.04em;
 }
 .scan-note {
 font-size: 0.7rem;
 color: #64748b;
 margin-top: 4px;
 letter-spacing: 0.02em;
 }

 @media print {
 body { background: #fff; padding: 0; }
 .control-header { display: none; }
 .standee-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
 .standee-card { box-shadow: none; }
 }
 </style>
</head>
<body>

 <div class="control-header">
 <div>
 <h2 style="font-size: 1.15rem; font-weight: 800; letter-spacing: 0.06em; margin-bottom: 4px;">TABLE STANDEES (TABLES 1–8)</h2>
 <p style="font-size: 0.8rem; color: #9ca3af; margin: 0;">Scan with camera to open the restaurant table menu instantly.</p>
 </div>
 <button class="print-button" onclick="window.print()">PRINT STANDEES</button>
 </div>

 <div class="standee-grid" id="standeesContainer"></div>

 <script>
 const TABLES_COUNT = 8;
 const baseUrl = 'https://divflow.pages.dev';
 const container = document.getElementById('standeesContainer');

 for (let i = 1; i <= TABLES_COUNT; i++) {
 const TOKENS = {"1":"T1_9e8a7b4f","2":"T2_4c5d6e1a","3":"T3_7f8a9b2c","4":"T4_1a2b3c9d","5":"T5_8d9e0f5e","6":"T6_3c4d5e8a","7":"T7_6f7a8b1c","8":"T8_2a3b4c7d"};
 const targetUrl = `${baseUrl}/?t=${TOKENS[i]}`;
 const encodedUrl = encodeURIComponent(targetUrl);
 const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodedUrl}&margin=4`;

 const card = document.createElement('div');
 card.className = 'standee-card';
 card.innerHTML = `
 <div class="hotel-name">THE GRAND ESTATE</div>
 <div class="hotel-sub">Table-Side Dining Service</div>
 
 <div class="qr-frame">
 <img class="qr-img" src="${qrApiUrl}" alt="Table ${i} QR Code" loading="lazy">
 </div>

 <div class="table-banner">TABLE ${i}</div>
 <div class="scan-instruction">SCAN WITH CAMERA TO ORDER</div>
 <div class="scan-note">Instant kitchen dispatch | Real-time live billing</div>
 `;
 container.appendChild(card);
 }
 </script>
</body>
</html>
