<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display System — Spice & Slice Bistro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kitchen.css">
</head>
<body>
  <header class="m3-kds-header">
    <div class="m3-kds-brand">
      <span class="m3-kds-icon">👨‍🍳</span>
      <div>
        <h1>Kitchen Display System (KDS)</h1>
        <span class="m3-kds-sub">Spice & Slice Bistro • Live Order Dispatcher</span>
      </div>
    </div>
    <div class="m3-kds-actions">
      <a href="index.html" target="_blank" class="m3-kds-btn">📱 Customer App</a>
      <a href="qr.html" target="_blank" class="m3-kds-btn">🖨️ QR Standees</a>
      <button class="m3-kds-btn m3-btn-audio" id="audioToggleBtn" onclick="toggleAudio()">🔔 Sound: ON</button>
      <button class="m3-kds-btn m3-btn-danger" onclick="clearAllOrders()">🗑️ Reset Orders</button>
    </div>
  </header>

  <main class="m3-kds-main">
    <div class="m3-kds-stats-row">
      <div class="m3-stat-box">
        <span class="m3-stat-value" id="activeOrdersCount">0</span>
        <span class="m3-stat-label">Active Table Orders</span>
      </div>
      <div class="m3-stat-box">
        <span class="m3-stat-value" id="totalPreparingCount">0</span>
        <span class="m3-stat-label">Currently Cooking</span>
      </div>
      <div class="m3-stat-box">
        <span class="m3-stat-value" id="totalTodaySales">₹0</span>
        <span class="m3-stat-label">Active Sales Volume</span>
      </div>
    </div>

    <div class="m3-kds-cards-grid" id="kdsGrid">
      <!-- Active KOT Cards injected dynamically -->
    </div>
  </main>

  <script src="kitchen.js"></script>
</body>
</html>
