<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display System — The Grand Estate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kitchen.css?v=v1787504353577">
</head>
<body>
  <header class="kds-bar">
    <div class="kds-title-group">
      <span class="kds-tag">KDS</span>
      <div>
        <h1>KITCHEN ORDER DISPATCHER</h1>
        <span class="kds-subtitle">The Grand Estate Bistro • Real-Time Terminal</span>
      </div>
    </div>
    <div class="kds-actions">
      <a href="index.html" target="_blank" class="kds-btn">CUSTOMER VIEW</a>
      <a href="qr.html" target="_blank" class="kds-btn">QR STANDEES</a>
      <button class="kds-btn btn-audio" id="audioToggleBtn" onclick="toggleAudio()">AUDIO ALERT: ON</button>
      <button class="kds-btn btn-clear" onclick="clearAllOrders()">CLEAR TICKETS</button>
    </div>
  </header>

  <main class="kds-container">
    
    <div class="kds-metrics-bar">
      <div class="metric-tile">
        <span class="metric-num" id="activeOrdersCount">0</span>
        <span class="metric-label">ACTIVE TICKETS</span>
      </div>
      <div class="metric-tile">
        <span class="metric-num" id="totalPreparingCount">0</span>
        <span class="metric-label">CURRENTLY COOKING</span>
      </div>
    </div>


    <div class="kds-tickets-grid" id="kdsGrid">
      <!-- Active KOT Cards injected here -->
    </div>
  </main>

  <script src="kitchen.js?v=v1787504353577"></script>
</body>
